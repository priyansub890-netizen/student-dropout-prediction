```html
<!DOCTYPE html>
<html>
<head>
    <title>Student Dropout Prediction</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="form-container">

    <h2>Student Dropout Prediction Form</h2>

    <form action="/predict" method="post">

        <label>Age:</label>
        <input type="number" name="age" required>

        <label>Study Time:</label>
        <select name="studytime" required>
            <option value="" disabled selected>Select</option>
            <option value="1">Less than 2 hours</option>
            <option value="2">2 to 5 hours</option>
            <option value="3">5 to 10 hours</option>
            <option value="4">More than 10 hours</option>
        </select><br><br>

        <label>Failures:</label>
        <input type="number" name="failures" required>

        <label>Absences:</label>
        <input type="number" name="absences" required>

        <label>First Grade Period (G1)(0-20):</label>
        <input type="number" name="g1" required>

        <label>Second Grade Period (G2)(0-20):</label>
        <input type="number" name="g2" required>

        <label>Family Support:</label>
        <select name="famsup" required>
            <option value="" disabled selected>Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select><br><br>

        <label>School Support:</label>
        <select name="schoolsup" required>
            <option value="" disabled selected>Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select><br><br>

        <label>Extra Paid Classes:</label>
        <select name="paid" required>
            <option value="" disabled selected>Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select><br><br>

        <label>Higher Education Goal:</label>
        <select name="higher" required>
            <option value="" disabled selected>Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select><br><br>

        <label>Living Area:</label>
        <select name="address" required>
            <option value="" disabled selected>Select</option>
            <option value="urban">Urban</option>
            <option value="rural">Rural</option>
        </select><br><br>

        <button type="submit">Predict</button>

    </form>

</div>

</body>
</html>
```
